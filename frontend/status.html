<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System status — pingTester</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="status">
  <div class="bg-grid"></div>
  <header data-nav></header>

  <main class="container" style="max-width:860px">
    <div class="status-hero reveal">
      <div class="eyebrow">Public status page</div>
      <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.03em">Service status</h1>
      <p class="muted" style="margin-top:.5rem">Live status of the monitors in your workspace. Refreshes automatically.</p>
    </div>

    <div class="status-banner ok reveal" id="banner"><span class="status-dot" id="bannerDot"></span><span id="bannerText">All systems operational</span></div>

    <div class="panel reveal" style="padding:0" id="services"></div>
    <p class="muted" style="font-size:.8rem;text-align:right;margin-top:.6rem" id="statusUpdated"></p>

    <h2 style="font-size:1.3rem;margin:3rem 0 1rem" class="reveal">Past incidents</h2>
    <div class="panel reveal" id="history"></div>

    <div class="panel reveal" style="margin-top:2rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div><strong>Get notified about incidents</strong><p class="muted" style="font-size:.88rem">We'll email you when an incident starts and when it's resolved.</p></div>
      <form id="subscribe" style="display:flex;gap:.5rem;flex-wrap:wrap" novalidate>
        <input class="input" id="subEmail" type="email" placeholder="you@company.com" style="width:240px" aria-label="Email" />
        <button class="btn btn-primary" type="submit">Subscribe</button>
      </form>
    </div>
  </main>

  <footer data-footer></footer>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/status.js"></script>
</body>
</html>
